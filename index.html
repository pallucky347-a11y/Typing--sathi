 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Sathi - Created by Sarita</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 5px;
    }
    .creator-tag {
      text-align: center;
      color: #007bff;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .guide-box {
      background-color: #eef6ff;
      border-left: 5px solid #007bff;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    /* Typing display box */
    .text-display {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      font-size: 20px;
      line-height: 1.6;
      background-color: #fff;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 15px;
      font-family: monospace;
      word-wrap: break-word;
    }
    /* Character highlighting */
    .correct {
      color: green;
      background-color: #e6ffe6;
    }
    .incorrect {
      color: red;
      background-color: #ffe6e6;
      text-decoration: underline;
    }
    .current {
      background-color: #ffd700;
      border-bottom: 2px solid #000;
    }
    .typing-input {
      font-size: 18px;
      padding: 12px;
      font-family: monospace;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-weight: bold;
      font-size: 16px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
    }
    .btn-reset {
      margin-top: 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-reset:hover {
      background-color: #0056b3;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Typing Sathi</h1>
  <div class="creator-tag">✨ Created by Sarita ✨</div>

  <!-- Student Name Box Added -->
  <div class="form-group">
    <label for="userName">आपका नाम (Student Name):</label>
    <input type="text" id="userName" placeholder="Apna naam likhein..." autocomplete="off">
  </div>

  <div class="form-group">
    <label>भाषा चुनें (Select Language)</label>
    <select id="langSelect" onchange="loadChapters()">
      <option value="en">English</option>
      <option value="hi">Hindi (Krutidev / Inscript)</option>
    </select>
  </div>

  <div class="form-group">
    <label>चैप्टर चुनें (Select Chapter)</label>
    <select id="chapterSelect" onchange="resetPractice()"></select>
  </div>

  <!-- Beginners Guide Section -->
  <div class="guide-box" id="guideText">
    💡 <b>Finger Placement Guide:</b> Baayein haath ki ungliyaan <b>A S D F</b> par aur daayein haath ki ungliyaan <b>J K L ;</b> par rakhein. Spacebar thumb (angoothe) se dabayein.
  </div>

  <div class="form-group">
    <label>समय (Timer)</label>
    <select id="timeSelect" onchange="resetPractice()">
      <option value="60">1 Minute</option>
      <option value="120">2 Minutes</option>
      <option value="300">5 Minutes</option>
    </select>
  </div>

  <!-- Text Display Screen -->
  <div class="text-display" id="textDisplay"></div>

  <!-- Typing Input Area -->
  <input type="text" id="userInput" class="typing-input" placeholder="Yahan type karna shuru karein..." oninput="handleTyping()" autocomplete="off">

  <div class="stats">
    <span>Time: <span id="timerDisplay">01:00</span></span>
    <span>WPM: <span id="wpmDisplay">0</span></span>
    <span>Accuracy: <span id="accuracyDisplay">100%</span></span>
  </div>

  <button class="btn-reset" onclick="resetPractice()">Reset / Restart</button>
  
  <div class="footer">
    &copy; 2026 Typing Sathi | Designed & Developed by Sarita
  </div>
</div>

<script>
  // Very long text contents to prevent early finishing

      { name: "Chapter 12: Programming & Symbols Master", text: "function calculateSum(a, b) { return a + b; } console.log(calculateSum(5, 10)); // Output is 15. Always test your algorithms thoroughly before deploying code to production servers." },
      { name: "Chapter 13: Long Paragraph Speed Master", text: "Mastering touch typing is an essential skill in the modern digital era. It dramatically improves productivity, reduces physical fatigue, and allows professionals to communicate ideas seamlessly across global networks without looking down at keys." },

    hi: [
      { name: "Chapter 1: होम रो बेसिक अभ्यास", text: "क ख ग घ च छ ज झ ट ठ ड ढ त थ द ध न क ख ग घ च छ ज झ ट ठ ड ढ त थ द ध न क ख ग घ च छ ज झ ट ठ ड ढ त थ द ध न" },

      { name: "Chapter 3: सामान्य वाक्य अभ्यास", text: "कंप्यूटर साथी में आपका स्वागत है। नियमित अभ्यास से स्पीड बढ़ती है। कंप्यूटर साथी में आपका स्वागत है। नियमित अभ्यास से स्पीड बढ़ती है।" },

      { name: "Chapter 5: कठिन शब्द और मात्राएँ", text: "विद्यार्थी, वैज्ञानिक, प्रौद्योगिकी, अंतर्राष्ट्रीय, आवश्यकता, स्वावलंबन, प्रासंगिकता, विश्वविद्यालय, अनुसंधान, प्रमाणीकरण, कार्यक्षमता, डिजिटलीकरण" }

  let baseText = "";
  let targetText = "";
  let timeLeft = 60;
  let timerInterval = null;
  let isTimerRunning = false;

  function loadChapters() {
    const lang = document.getElementById("langSelect").value;
    const chapterSelect = document.getElementById("chapterSelect");
    chapterSelect.innerHTML = "";

    lessons[lang].forEach((chap, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.innerText = chap.name;
      chapterSelect.appendChild(opt);
    });

    resetPractice();
  }

  function renderText() {
    const textDisplay = document.getElementById("textDisplay");
    const typedText = document.getElementById("userInput").value;

    if (typedText.length >= targetText.length - 15) {
      targetText += " " + baseText;
    }

    let html = "";
    for (let i = 0; i < targetText.length; i++) {
      let charClass = "";
      if (i < typedText.length) {
        if (typedText[i] === targetText[i]) {
          charClass = "correct";
        } else {
          charClass = "incorrect";
        }
      } else if (i === typedText.length) {
        charClass = "current";
      }

      let char = targetText[i];
      html += `<span class="${charClass}">${char}</span>`;
    }
    textDisplay.innerHTML = html;
