<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Sathi - Student Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        .logo-img {
            width: 90px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        h2 {
            margin: 5px 0;
            color: #333;
        }
        .sub-title {
            color: #007bff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-field {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 90%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.jpg" alt="Typing Sathi Logo" class="logo-img">
        <h2>Typing Sathi</h2>
        <div class="sub-title">Created by Sarita</div>

        <h3 style="color: #444; margin-top: 15px;">📝 Student Registration</h3>
        
        <!-- फॉर्म सबमिट होते ही यह सीधा practice.html पर ले जाएगा -->
        <form action="practice.html">
            <input type="text" class="input-field" placeholder="Student Full Name (पूरा नाम)" required><br>
            <input type="email" class="input-field" placeholder="Email / Mobile Number" required><br>
            <input type="password" class="input-field" placeholder="Password (पासवर्ड)" required><br>
            <button type="submit" class="btn-submit">Register & Start Practice 🚀</button>
        </form>
    </div>

</body>
</html>
