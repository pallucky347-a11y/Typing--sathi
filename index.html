 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Sathi - Created by Sarita</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 5px;
    }
    .creator-tag {
      text-align: center;
      color: #007bff;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .guide-box {
      background-color: #eef6ff;
      border-left: 5px solid #007bff;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    /* Typing display box */
    .text-display {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      font-size: 20px;
      line-height: 1.6;
      background-color: #fff;
      min-height: 100px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 15px;
      font-family: monospace;
      word-wrap: break-word;
    }
    /* Character highlighting */
    .correct {
      color: green;
      background-color: #e6ffe6;
    }
    .incorrect {
      color: red;
      background-color: #ffe6e6;
      text-decoration: underline;
    }
    .current {
      background-color: #ffd700;
      border-bottom: 2px solid #000;
    }
    .typing-input {
      font-size: 18px;
      padding: 12px;
      font-family: monospace;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-weight: bold;
      font-size: 16px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
    }
    .btn-reset {
      margin-top: 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-reset:hover {
      background-color: #0056b3;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Typing Sathi</h1>
  <div class="creator-tag">✨ Created by Sarita ✨</div>

  <div class="form-group">
    <label>भाषा चुनें (Select Language)</label>
    <select id="langSelect" onchange="loadChapters()">
      <option value="en">English</option>
      <option value="hi">Hindi (Krutidev / Inscript)</option>
    </select>
  </div>

  <div class="form-group">
    <label>चैप्टर चुनें (Select Chapter)</label>
    <select id="chapterSelect" onchange="resetPractice()"></select>
  </div>

  <!-- Beginners Guide Section -->
  <div class="guide-box" id="guideText">
    💡 <b>Finger Placement Guide:</b> Baayein haath ki ungliyaan <b>A S D F</b> par aur daayein haath ki ungliyaan <b>J K L ;</b> par rakhein. Spacebar thumb (angoothe) se dabayein.
  </div>

  <div class="form-group">
    <label>समय (Timer)</label>
    <select id="timeSelect" onchange="resetPractice()">
      <option value="60">1 Minute</option>
      <option value="120">2 Minutes</option>
      <option value="300">5 Minutes</option>
    </select>
  </div>

  <!-- Text Display Screen -->
  <div class="text-display" id="textDisplay"></div>

  <!-- Typing Input Area -->
  <input type="text" id="userInput" class="typing-input" placeholder="Yahan type karna shuru karein..." oninput="handleTyping()" autocomplete="off">

  <div class="stats">
    <span>Time: <span id="timerDisplay">01:00</span></span>
    <span>WPM: <span id="wpmDisplay">0</span></span>
    <span>Accuracy: <span id="accuracyDisplay">100%</span></span>
  </div>

  <button class="btn-reset" onclick="resetPractice()">Reset / Restart</button>
  
  <div class="footer">
    &copy; 2026 Typing Sathi | Designed & Developed by Sarita
  </div>
</div>

<script>
  // Lessons Data including Beginners, Old, and 6 New Advanced Chapters
  const lessons = {
    en: [
      { name: "Chapter 1: Home Row Basic (a s d f j k l ;)", text: "asdf jkl; asdf jkl; a s d f j k l ; fjdksla; fjdk sl a;" },
      { name: "Chapter 2: Home Row Words", text: "fall glad flask alas lads dads fads ask all fall salad a flash" },
      { name: "Chapter 3: Top Row Practice (q w e r t y u i o p)", text: "qwer tyui op qwert yuiop quiet power tower write read tree type" },
      { name: "Chapter 4: Bottom Row Practice (z x c v b n m)", text: "zxcv bnm zxcvb nm clean voice brown van cab box comb exam" },
      { name: "Chapter 5: Shift Key & Capital Letters", text: "Sarita Typing Sathi India Delhi Keyboard Practice Success Goal" },
      { name: "Chapter 6: Basic Practice (Purana Basic)", text: "the quick brown fox jumps over the lazy dog" },
      { name: "Chapter 7: Medium Practice (Purana Medium)", text: "typing fast requires daily practice and focus on proper finger position" },
      { name: "Chapter 8: Advanced Practice (Purana Advanced)", text: "artificial intelligence and web development are shaping the future of technology and computer education" },
      // 6 New Added Advanced Chapters
      { name: "Chapter 9: Advanced Speed Drills (Punctuation)", text: "Always double-check your code; errors are common when typing fast! Did you finish the task? Yes, I did." },
      { name: "Chapter 10: Advanced Complex Vocabulary", text: "Extraordinary accomplishments necessitate persistent dedication, rigorous discipline, and uncompromising focus." },
      { name: "Chapter 11: Professional Business Sentences", text: "Dear manager, please review the quarterly financial reports and submit your feedback before Friday afternoon." },
      { name: "Chapter 12: Programming & Symbols Practice", text: "function calculateSum(a, b) { return a + b; } console.log(calculateSum(5, 10)); // Output is 15" },
      { name: "Chapter 13: Long Paragraph Speed Master", text: "Mastering touch typing is an essential skill in the modern digital era. It dramatically improves productivity, reduces physical fatigue, and allows professionals to communicate ideas seamlessly across global networks." },
      { name: "Chapter 14: Ultimate Expert Challenge", text: "In a world driven by continuous innovation, adaptability and continuous learning form the bedrock of enduring professional success. Sarita created this platform to empower every learner worldwide." }
    ],
    hi: [
      { name: "Chapter 1: होम रो बेसिक", text: "क ख ग घ च छ ज झ ट ठ ड ढ त थ द ध न" },
      { name: "Chapter 2: शब्द अभ्यास", text: "कमल नयन भारत सरकार शिक्षा साथी टाइपिंग सरिता" },
      { name: "Chapter 3: सामान्य वाक्य", text: "कंप्यूटर साथी में आपका स्वागत है। नियमित अभ्यास से स्पीड बढ़ती है।" },
      { name: "Chapter 4: एडवांस्ड अनुच्छेद", text: "शिक्षा किसी भी देश और समाज के विकास की सबसे महत्वपूर्ण नींव होती है। सरिता द्वारा बनाई गई यह वेबसाइट छात्रों को डिजिटल रूप से सशक्त बनाती है।" },
      { name: "Chapter 5: कठिन शब्द और मात्राएँ", text: "विद्यार्थ, वैज्ञानिक, प्रौद्योगिकी, अंतर्राष्ट्रीय, आवश्यकता, स्वावलंबन, प्रासंगिकता" }
    ]
  };

  let targetText = "";
  let timeLeft = 60;
  let timerInterval = null;
  let isTimerRunning = false;

  function loadChapters() {
    const lang = document.getElementById("langSelect").value;
    const chapterSelect = document.getElementById("chapterSelect");
    chapterSelect.innerHTML = "";

    lessons[lang].forEach((chap, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.innerText = chap.name;
      chapterSelect.appendChild(opt);
    });

    resetPractice();
  }

  function renderText() {
    const textDisplay = document.getElementById("textDisplay");
    const typedText = document.getElementById("userInput").value;

    let html = "";
    for (let i = 0; i < targetText.length; i++) {
      let charClass = "";
      if (i < typedText.length) {
        if (typedText[i] === targetText[i]) {
          charClass = "correct";
        } else {
          charClass = "incorrect";
        }
      } else if (i === typedText.length) {
        charClass = "current";
      }

      let char = targetText[i];
      html += `<span class="${charClass}">${char}</span>`;
    }
    textDisplay.innerHTML = html;
  }

  function handleTyping() {
    if (!isTimerRunning) {
      startTimer();
    }

    renderText();
    calculateStats();
  }

  function startTimer() {
    isTimerRunning = true;
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerDisplay();
        calculateStats();
      } else {
        clearInterval(timerInterval);
        document.getElementById("userInput").disabled = true;
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const secs = String(timeLeft % 60).padStart(2, '0');
    document.getElementById("timerDisplay").innerText = `${mins}:${secs}`;
  }

  function calculateStats() {
    const typed = document.getElementById("userInput").value;
    const totalTimePassed = parseInt(document.getElementById("timeSelect").value) - timeLeft;

    if (totalTimePassed > 0) {
      const wordsTyped = typed.trim().split(/\s+/).length;
      const wpm = Math.round((wordsTyped / totalTimePassed) * 60);
      document.getElementById("wpmDisplay").innerText = isNaN(wpm) ? 0 : wpm;
    }

    let correctChars = 0;
    for (let i = 0; i < typed.length; i++) {
      if (typed[i] === targetText[i]) correctChars++;
    }

    const accuracy = typed.length > 0 ? Math.round((correctChars / typed.length) * 100) : 100;
    document.getElementById("accuracyDisplay").innerText = `${accuracy}%`;
  }

  function resetPractice() {
    clearInterval(timerInterval);
    isTimerRunning = false;
    
    const lang = document.getElementById("langSelect").value;
    const chapIdx = document.getElementById("chapterSelect").value || 0;
    targetText = lessons[lang][chapIdx].text;

    timeLeft = parseInt(document.getElementById("timeSelect").value);
    document.getElementById("userInput").value = "";
    document.getElementById("userInput").disabled = false;
    document.getElementById("wpmDisplay").innerText = "0";
    document.getElementById("accuracyDisplay").innerText = "100%";
    
    updateTimerDisplay();
    renderText();
  }

  // Initial Load
  window.onload = loadChapters;
</script>

</body>
   </html>
