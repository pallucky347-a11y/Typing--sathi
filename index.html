<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Sathi - Student Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        .logo-img {
            width: 90px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        h2 {
            margin: 5px 0;
            color: #333;
        }
        .sub-title {
            color: #007bff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-field {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 90%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.jpg" alt="Typing Sathi Logo" class="logo-img">
        <h2>Typing Sathi</h2>
        <div class="sub-title">Created by Sarita</div>

        <h3 style="color: #444; margin-top: 15px;">📝 Student Registration</h3>
        
        <!-- फॉर्म सबमिट होते ही यह सीधा practice.html पर ले जाएगा -->
        <form action="practice.html">
            <input type="text" class="input-field" placeholder="Student Full Name (पूरा नाम)" required><br>
            <input type="email" class="input-field" placeholder="Email / Mobile Number" required><br>
             <!-- Course/Student Type Selector -->
<div class="input-field-group">
  <label for="student-type">Course Type (कोर्स का प्रकार):</label>
  <select id="student-type" class="input-field" onchange="togglePasswordRequired()">
    <option value="normal">Normal Student (निःशुल्क / फ्री)</option>
    <option value="government">Government Exam Student (पासवर्ड आवश्यक)</option>
  </select>
</div>

<!-- Password Field Container -->
<div id="password-container" style="display: none; margin-top: 10px;">
  <input type="password" id="student-password" class="input-field" placeholder="Government Access Password (पासवर्ड दर्ज करें)">
</div>
            <button type="submit" class="btn-submit">Register & Start Practice 🚀</button>
        </form>
    </div>
    <!-- ========================================== -->
<!-- 1. NORMAL CHAPTER WELCOME MODAL -->
<!-- ========================================== -->
 <div id="welcomeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999;">
    <div style="background:#ffffff; padding:25px; border-radius:12px; position:relative; text-align:center; max-width:360px; width:90%; margin:50px auto;">
        <button onclick="document.getElementById('welcomeModal').style.display='none'" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:22px; font-weight:bold; cursor:pointer; color:#555;">✖</button>
    <input type="text" id="studentNameInput" placeholder="अपना नाम लिखें (Optional)" style="width:90%; padding:10px; margin-bottom:18px; border:1px solid #ccc; border-radius:6px; font-size:14px; outline:none;">
    
    <button onclick="startNormalChapter()" style="background:#28a745; color:white; border:none; padding:12px 20px; border-radius:6px; font-size:15px; cursor:pointer; font-weight:bold; width:100%;">🚀 Start Practice</button>
  </div>
</div>

<!-- ========================================== -->
<!-- 2. GOVT PREPARATION PASSWORD MODAL -->
<!-- ========================================== -->
<div id="govtModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.65); justify-content:center; align-items:center; z-index:9999;">
  <div style="background:#ffffff; padding:25px; border-radius:12px; text-align:center; max-width:360px; width:90%; box-shadow:0 8px 20px rgba(0,0,0,0.3); font-family: sans-serif;">
    <h3 style="color:#d9534f; margin-top:0; margin-bottom:10px; font-size:20px;">🔒 Govt Exam Chapter Access</h3>
    <p style="color:#555; font-size:13px; margin-bottom:15px; line-height:1.4;">इस चैप्टर को अनलॉक करने के लिए अपना स्पेशल एक्सेस पासवर्ड दर्ज करें:</p>
    
    <input type="password" id="govtPasswordInput" placeholder="Enter Govt Access Password" style="width:90%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; outline:none;">
    
    <p id="govtErrorMsg" style="color:#d9534f; font-size:12px; margin-bottom:12px; display:none; font-weight:bold;"></p>
    
    <div style="display:flex; justify-content:space-between; gap:10px;">
      <button onclick="verifyGovtPassword()" style="background:#0275d8; color:white; border:none; padding:10px; border-radius:6px; font-size:14px; cursor:pointer; font-weight:bold; flex:1;">Unlock Chapter</button>
      <button onclick="closeGovtModal()" style="background:#6c757d; color:white; border:none; padding:10px; border-radius:6px; font-size:14px; cursor:pointer; flex:1;">Cancel</button>
    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- 3. JAVASCRIPT LOGIC & 50 GOVT PASSWORDS -->
<!-- ========================================== -->
<script>
  const ALLOWED_GOVT_PASSWORDS = [
    "GOVT#SATHI@8492", "EXAM$PRP#9201", "SSC#MASTER@4713", "BANK$PREP#8305", "GOVT#ACCS@1948",
    "STFF$SELC#7294", "RAIL$JOB#6183", "UPSS$CPST#5029", "CRPF$TYPE#3814", "DEF$GOVT#9162",
    "TS#GOVT@8391", "GV$SECURE#6402", "PASS$GOVT#7159", "TS#CPT@5924", "GOVT$TEST#4831",
    "EXAM#PASS@9073", "GOVT$PORTAL#3185", "OFFICER#PASS@6249", "GOVT#ZONE@7310", "SKILL$TEST#8592",
    "GVT#BATCH1@9401", "GVT#BATCH2@8152", "GVT#BATCH3@3729", "GVT#BATCH4@6048", "GVT#BATCH5@5291",
    "GVT#BATCH6@7483", "GVT#BATCH7@1930", "GVT#BATCH8@8264", "GVT#BATCH9@4051", "GVT#BATCH10@6372",
    "TYPIST#GOVT$8419", "TYPIST#GOVT$9302", "TYPIST#GOVT$1847", "TYPIST#GOVT$6295", "TYPIST#GOVT$5031",
    "TYPIST#GOVT$7184", "TYPIST#GOVT$4926", "TYPIST#GOVT$8310", "TYPIST#GOVT$2075", "TYPIST#GOVT$6583",
    "SARITA#GOVT$9914", "SARITA#GOVT$8273", "SARITA#GOVT$6105", "SARITA#GOVT$4392", "SARITA#GOVT$7518",
    "SARITA#GOVT$2849", "SARITA#GOVT$5063", "SARITA#GOVT$9137", "SARITA#GOVT$3720", "SARITA#GOVT$8461"
  ];
  let currentSelectedChapter = null;

  // Normal Chapter Click Handler
  function openNormalChapter(chapterId) {
    currentSelectedChapter = chapterId;
    document.getElementById('welcomeModal').style.display = 'flex';
  }

  function startNormalChapter() {
    const studentName = document.getElementById('studentNameInput').value.trim() || "Guest Student";
    localStorage.setItem('student_name', studentName);
    localStorage.setItem('selected_chapter', currentSelectedChapter);
    localStorage.setItem('is_govt_chapter', 'false');
    
    document.getElementById('welcomeModal').style.display = 'none';
    window.location.href = 'practice.html'; // Direct practice.html par bhejega
  }

  // Govt Chapter Click Handler
  function openGovtChapter(chapterId) {
    currentSelectedChapter = chapterId;
    document.getElementById('govtPasswordInput').value = '';
    document.getElementById('govtErrorMsg').style.display = 'none';
    document.getElementById('govtModal').style.display = 'flex';
  }

  function closeGovtModal() {
    document.getElementById('govtModal').style.display = 'none';
  }

  function verifyGovtPassword() {
    const inputPass = document.getElementById('govtPasswordInput').value.trim();
    const errorElem = document.getElementById('govtErrorMsg');

    if (ALLOWED_GOVT_PASSWORDS.includes(inputPass)) {
      const currentSessionToken = Date.now().toString();
      localStorage.setItem('active_govt_pass', inputPass);
      localStorage.setItem('active_govt_session', currentSessionToken);
      localStorage.setItem('selected_chapter', currentSelectedChapter);
      localStorage.setItem('is_govt_chapter', 'true');

      closeGovtModal();
      window.location.href = 'practice.html'; // Password sahi hone par practice.html par bhejega
    } else {
      errorElem.innerText = "❌ गलत पासवर्ड! कृपया सही एक्सेस पासवर्ड दर्ज करें।";
      errorElem.style.display = 'block';
    }
  }
    // 1. जब फ्री/नॉर्मल चैप्टर पर क्लिक हो (पासवर्ड बॉक्स छुप जाएगा)
function openNormalChapter(chapterId) {
  currentSelectedChapter = chapterId;
  document.getElementById('modalTitle').innerText = 'Student Registration';
  
  // पासवर्ड का डिब्बा छुपा दें
  const passBox = document.getElementById('govtPasswordContainer');
  if (passBox) passBox.style.display = 'none';
  
  document.getElementById('welcomeModal').style.display = 'block';
}

// 2. जब Govt Chapter पर क्लिक हो (पासवर्ड बॉक्स दिखाई देगा)
function openGovtChapter(chapterId) {
  currentSelectedChapter = chapterId;
  document.getElementById('modalTitle').innerText = 'Govt Exam Chapter Access';
  
  // पासवर्ड का डिब्बा दिखाएँ
  const passBox = document.getElementById('govtPasswordContainer');
  if (passBox) passBox.style.display = 'block';
  
  document.getElementById('welcomeModal').style.display = 'block';
}

// 3. फॉर्म सबमिट होने पर चेक करने के लिए
function startPractice() {
  const name = document.getElementById('studentName').value.trim();
  const contact = document.getElementById('studentContact').value.trim();
  const passBox = document.getElementById('govtPasswordContainer');

  if (!name || !contact) {
    alert("कृपया अपना नाम और संपर्क जानकारी भरें!");
    return;
  }

  // अगर पासवर्ड वाला डिब्बा दिख रहा है, मतलब यह Govt Chapter है
  if (passBox && passBox.style.display !== 'none') {
    const inputPass = document.getElementById('studentPassword').value.trim();

    if (!ALLOWED_GOVT_PASSWORDS.includes(inputPass)) {
      alert("❌ अमान्य पासवर्ड! कृपया सही पासवर्ड दर्ज करें।");
      return;
    }

    // Single Device Security के लिए सेशन टोकन सेट करें
    const sessionToken = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('is_govt_chapter', 'true');
    localStorage.setItem('active_govt_pass', inputPass);
    localStorage.setItem('active_govt_session', sessionToken);
  } else {
    // Normal Chapter के लिए (बिना पासवर्ड)
    localStorage.setItem('is_govt_chapter', 'false');
    localStorage.removeItem('active_govt_pass');
    localStorage.removeItem('active_govt_session');
  }

  // छात्र का नाम और चैप्टर सेव करके प्रैक्टिस पेज पर भेजें
  localStorage.setItem('student_name', name);
  localStorage.setItem('selected_chapter', currentSelectedChapter);
  window.location.href = 'practice.html';
}
    function handleRegistration(event) {
    if (event) event.preventDefault(); // पेज रीलोड होने से रोकेगा

    const studentType = document.getElementById('student-type').value;
    const passwordInput = document.getElementById('student-password') ? document.getElementById('student-password').value : '';

    if (studentType === 'government') {
        const SECRET_GOVT_PASSWORD = "GOVT2026"; // आपका पासवर्ड
        if (passwordInput !== SECRET_GOVT_PASSWORD) {
            alert("गलत पासवर्ड! कृपया सही पासवर्ड दर्ज करें।");
            return false;
        }
    }

    // रजिस्ट्रेशन कार्ड को छिपाएँ
    const registrationCard = document.querySelector('.card');
    if (registrationCard) {
        registrationCard.style.display = 'none';
    }

    return false;
    }function togglePasswordRequired() {
    const studentType = document.getElementById('student-type').value;
    const passwordContainer = document.getElementById('password-container');
    const passwordInput = document.getElementById('student-password');

    if (studentType === 'government') {
        passwordContainer.style.display = 'block';
        passwordInput.required = true;
    } else {
        passwordContainer.style.display = 'none';
        passwordInput.required = false;
        passwordInput.value = '';
    }
}

function handleRegistration(event) {
    if (event) event.preventDefault();

    const studentType = document.getElementById('student-type').value;
    const passwordInput = document.getElementById('student-password') ? document.getElementById('student-password').value : '';

    if (studentType === 'government') {
        const SECRET_GOVT_PASSWORD = "GOVT2026";
        if (passwordInput !== SECRET_GOVT_PASSWORD) {
            alert("गलत पासवर्ड! कृपया सही गवर्नमेंट पासवर्ड दर्ज करें।");
            return false;
        }
    }

    // सीधे practice.html पेज पर भेजें
    window.location.href = 'practice.html';
    return false;
}
</script>

</body>
</html>
